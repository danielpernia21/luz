name: Luz

on:
  schedule:
    # GitHub solo admite cron en UTC y España cambia entre UTC+1 y UTC+2,
    # por eso se lanzan las dos horas posibles y el script descarta la que no toca.
    # Resumen del día: 09:00 en Madrid.
    - cron: '0 7,8 * * *'
    # Aviso previo: minuto 47 de cada hora entre las 09:00 y las 19:00 en Madrid.
    # Las franjas siempre empiezan en punto, así que no hace falta sondear más a menudo.
    - cron: '47 7-17 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Qué mensaje enviar'
        type: choice
        options: [summary, reminder]
        default: summary
      force:
        description: 'Ignorar los filtros horarios'
        type: boolean
        default: true
      dry_run:
        description: 'Solo imprimir el mensaje, sin enviarlo'
        type: boolean
        default: false

concurrency:
  group: luz
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Enviar mensaje
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event.schedule == '47 7-17 * * *' && 'reminder' || (github.event.inputs.mode || 'summary') }}
          FORCE: ${{ github.event.inputs.force }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          args="--mode $MODE"
          if [ "$FORCE" = "true" ]; then args="$args --force"; fi
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          echo "Ejecutando: python -m luzbot.main $args"
          python -m luzbot.main $args
